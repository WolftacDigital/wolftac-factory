name: Factory Checks

on:
  pull_request:
    branches: [main]

jobs:
  factory-checks:
    name: factory-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Watchdog regression tests compare against origin/main, not the PR tree.
          fetch-depth: 0

      - name: Check cross-port parity
        run: ./deploy/parity-check.ps1

      - name: Check workflow semantics
        run: ./deploy/semantic-check.ps1

      - name: Test factory gatekeeper
        run: python3 -m unittest discover -s deploy/tests -v

      - name: Reject CR bytes in tracked source documents
        run: |
          $extensions = @(".md", ".json", ".ps1", ".yml", ".yaml", ".py")
          $tracked = @(git ls-files | Where-Object {
            $extensions -contains [IO.Path]::GetExtension($_).ToLowerInvariant()
          })
          $withCr = @($tracked | Where-Object {
            ([IO.File]::ReadAllBytes($_) -contains 13)
          })
          if ($withCr.Count -gt 0) {
            $withCr | ForEach-Object { Write-Output "CR BYTE: $_" }
            throw "LF check failed: tracked source documents contain CR bytes"
          }
          Write-Output "LF OK: $($tracked.Count) tracked source documents contain no CR bytes"

  linux-host-portability:
    name: linux-host-portability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Exercise isolated Gatekeeper and watchdog on Linux
        env:
          POWERSHELL_TELEMETRY_OPTOUT: "1"
          POWERSHELL_UPDATECHECK: "Off"
        run: python3 -B deploy/tests/linux_host_smoke.py --output "$RUNNER_TEMP/linux-host/proof.json"
      - name: Preserve exact lane and finding proof
        uses: actions/upload-artifact@v4
        with:
          name: linux-host-proof
          path: ${{ runner.temp }}/linux-host/proof.json
          if-no-files-found: error
